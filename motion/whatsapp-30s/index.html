<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Motion Graphic</title>
<style>
@font-face{font-family:Manrope;src:url(../../manrope-500.woff2) format('woff2');font-weight:500}

@font-face{font-family:Manrope;src:url(../../manrope-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:Manrope;src:url(../../manrope-800.woff2) format('woff2');font-weight:800}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Manrope,system-ui,sans-serif}
body{display:grid;place-items:center}
canvas{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;
  background:rgba(10,20,18,.72);backdrop-filter:blur(10px);color:#e9fff3;padding:8px 14px;border-radius:999px;
  font-size:14px;width:min(720px,calc(100vw - 32px));box-sizing:border-box;opacity:.25;transition:opacity .2s}
#ui:hover{opacity:1}
#ui button{background:#25D366;color:#062;border:0;border-radius:999px;width:34px;height:34px;font-weight:800;cursor:pointer}
#ui input{flex:1;accent-color:#25D366}
#ui span{font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
body.render #ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="pp" title="Play/Pause (Leertaste)">❚❚</button><input id="sc" type="range" min="0" max="30" step="0.001" value="0"><span id="tm">0.00</span></div>

   Deterministische Canvas-Engine: jedes Bild = f(t). Dadurch frame-genau
   renderbar (render.cjs) und live im Browser abspielbar.

const W = 1920, H = 1080, FPS = 30, DUR = 30;
const RENDER = new URLSearchParams(location.search).has('render');

/* ---------- Mathe & Easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const E = {
  lin: x => x,
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackSoft: x => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },

for (const k in ICON_SRC) IC[k] = new Path2D(ICON_SRC[k]);
function icon(n, x, y, s, col) { g.save(); g.translate(x - s / 2, y - s / 2); g.scale(s / 24, s / 24); g.fillStyle = col; g.fill(IC[n]); g.restore(); }

/* ---------- Typo: kinetische Wort-Reveals ---------- */
function ktext(str, x, y, size, weight, color, lt, tin, tout = 99, o = {}) {

  font(weight, size); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const words = str.split(' '), sp = g.measureText(' ').width;
  const ws = words.map(w => g.measureText(w).width);

  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  words.forEach((w, i) => {

    const q = P(lt, tout + i * stagger * .6, tout + i * stagger * .6 + .42, E.inCubic);

  if (p <= 0 || q >= 1) return;

  g.strokeStyle = C.green; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(lx, y); g.lineTo(lx + 46 * p, y); g.stroke();

function titleBlock(lt, x, y, kick, lines, sub, tin, tout, size = 92, align = 'left') {
  kicker(kick, x, y, lt, tin, tout, align);
  lines.forEach((l, i) => ktext(l, x, y + size * .95 + i * size * 1.02, size, 800, '#fff', lt, tin + .08 + i * .1, tout + i * .05, { align }));
  if (sub) {
    const sy = y + size * .95 + (lines.length - 1) * size * 1.02 + 62;

  g.fillStyle = 'rgba(255,255,255,.88)';
  circle(x, y - r * .18, r * .36); g.fill();

  const col = out ? C.bubbleOut : '#fff';

  if (out) { g.moveTo(bx + w - 12, y); g.lineTo(bx + w + 9, y); g.lineTo(bx + w, y + 13); }
  else { g.moveTo(bx + 12, y); g.lineTo(bx - 9, y); g.lineTo(bx, y + 13); }
  g.fill();
  g.save(); g.shadowColor = 'rgba(0,0,0,.13)'; g.shadowBlur = 2; g.shadowOffsetY = 1; rr(bx, y, w, h, 12); g.fill(); g.restore();
  g.fillStyle = C.ink; g.textBaseline = 'middle'; g.fillText(text, bx + 13, y + h / 2);
  font(500, 12); g.fillStyle = C.sub; g.fillText(o.time || '20:14', bx + tw + 24, y + h - 13);

/* =====================================================================
   KAMERA – Keyframes in Weltkoordinaten
   bank = Rolle während des Schwenks, dip = Zoom-Out während des Schwenks

   ===================================================================== */
const S = {
  chat: [0, 0], media: [2600, 0], calls: [2600, 1800], groups: [0, 1800],
  status: [0, 3600], loc: [-2600, 3600], enc: [-2600, 1800], outro: [-2600, 0],

const K = [
  { t: 0, x: 60, y: 0, z: 1.18, r: .02 },
  { t: 2.45, x: 40, y: 0, z: 1.0, r: 0, e: E.outCubic },
  { t: 3.0, x: -360, y: -100, z: 42, r: 0, e: E.inExpo, zoomTo: 1 },
  { t: 3.0, x: 0, y: 0, z: .78, r: -.07 },
  { t: 3.9, x: 0, y: 0, z: 1.0, r: 0, e: E.outExpo },
  { t: 7.65, x: 40, y: 10, z: 1.07, r: .012, e: E.inOutSine },
  { t: 8.35, x: 2600, y: 0, z: 1.0, r: 0, e: E.inOutQuint, bank: .07, dip: .28 },
  { t: 10.65, x: 2640, y: 0, z: 1.06, r: -.01, e: E.inOutSine },
  { t: 11.35, x: 2600, y: 1800, z: 1.0, r: 0, e: E.inOutQuint, bank: -.06, dip: .32 },
  { t: 14.15, x: 2620, y: 1815, z: 1.07, r: .012, e: E.inOutSine },
  { t: 14.85, x: 0, y: 1800, z: 1.0, r: 0, e: E.inOutQuint, bank: .22, dip: .34 },
  { t: 17.65, x: -20, y: 1795, z: 1.06, r: -.018, e: E.inOutSine },
  { t: 18.35, x: 0, y: 3600, z: 1.0, r: 0, e: E.inOutQuint, bank: .07, dip: .28 },
  { t: 20.65, x: 20, y: 3600, z: 1.05, r: .012, e: E.inOutSine },
  { t: 21.35, x: -2600, y: 3600, z: 1.0, r: -.02, e: E.inOutQuint, bank: -.08, dip: .3 },
  { t: 23.65, x: -2620, y: 3592, z: 1.07, r: .018, e: E.inOutSine },
  { t: 24.35, x: -2600, y: 1800, z: .97, r: 0, e: E.inOutQuint, bank: .06, dip: .32 },
  { t: 26.65, x: -2600, y: 1800, z: 1.04, r: 0, e: E.inOutSine },
  { t: 27.35, x: -2600, y: 0, z: .92, r: 0, e: E.inOutQuint, bank: -.07, dip: .3 },
  { t: 30, x: -2600, y: 0, z: 1.0, r: 0, e: E.outCubic },

function cam(t) {
  if (t <= K[0].t) return { ...K[0] };
  for (let i = 0; i < K.length - 1; i++) {
    const a = K[i], b = K[i + 1];
    if (t >= a.t && t < b.t) {
      const p = (b.e || E.inOutSine)((t - a.t) / (b.t - a.t)), s = Math.sin(Math.PI * p);
      const z = Math.exp(lerp(Math.log(a.z), Math.log(b.z), p));
      const pxy = b.zoomTo ? (1 / a.z - 1 / z) / (1 / a.z - 1 / b.z) : p;
      return { x: lerp(a.x, b.x, pxy), y: lerp(a.y, b.y, pxy), z: z * (1 - (b.dip || 0) * s), r: lerp(a.r, b.r, p) + (b.bank || 0) * s };
    }

}
function applyCam(c) { g.setTransform(1, 0, 0, 1, 0, 0); g.translate(W / 2, H / 2); g.rotate(c.r); g.scale(c.z, c.z); g.translate(-c.x, -c.y); }

/* =====================================================================
   HINTERGRUND
   ===================================================================== */
function background(t, c) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#040B09'; g.fillRect(0, 0, W, H);
  const blobs = [
    [W * (.25 + .08 * Math.sin(t * .4)), H * (.3 + .1 * Math.cos(t * .33)), 900, 'rgba(18,140,90,.30)'],
    [W * (.8 + .06 * Math.cos(t * .37)), H * (.75 + .08 * Math.sin(t * .29)), 1000, 'rgba(0,110,120,.26)'],
    [W * .55, H * (.1 + .05 * Math.sin(t * .5)), 700, 'rgba(37,211,102,.10)'],
  ];
  for (const [x, y, r, col] of blobs) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  // Parallax-Bokeh (3 Tiefen)
  for (let i = 0; i < 34; i++) {
    const d = .12 + rnd(i * 5.3) * .5, span = W + 600, spanY = H + 600;
    let x = (rnd(i) * 9000 - c.x * d * c.z) % span; if (x < 0) x += span;
    let y = (rnd(i * 2.7) * 9000 - c.y * d * c.z + t * 8 * d) % spanY; if (y < 0) y += spanY;
    x -= 300; y -= 300;
    const r = 6 + d * 60, a = .05 + (1 - d) * .05;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(120,255,180,${a})`); gr.addColorStop(.6, `rgba(60,220,140,${a * .5})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
function worldGrid(c) {
  if (c.z > 6) return;
  const R = Math.hypot(W, H) / 2 / c.z, step = 80;
  const x0 = Math.floor((c.x - R) / step) * step, x1 = c.x + R, y0 = Math.floor((c.y - R) / step) * step, y1 = c.y + R;
  g.fillStyle = 'rgba(160,255,200,.075)';
  g.beginPath();
  for (let x = x0; x <= x1; x += step) for (let y = y0; y <= y1; y += step) { g.moveTo(x + 1.8, y); g.arc(x, y, 1.8, 0, TAU); }
  g.fill();
}
/* fließende Linien – "Flow" */
function flowLines(lt, cx, cy, wdt, amp, n, p, phase = 0, col = '37,211,102') {
  if (p <= 0) return;
  g.save(); g.lineCap = 'round';
  for (let k = 0; k < n; k++) {
    const a = .08 + .14 * (1 - k / n);
    g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = 2 + (k === 0 ? 2 : 0);
    g.beginPath();
    const steps = 90, end = Math.floor(steps * p);
    for (let s = 0; s <= end; s++) {
      const u = s / steps, x = cx - wdt / 2 + u * wdt;
      const env = Math.sin(Math.PI * u);
      const y = cy + env * amp * (Math.sin(u * 7 + lt * 1.6 + k * .55 + phase) * .7 + Math.sin(u * 13 - lt * 1.1 + k) * .3) + k * 9;
      s ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}

/* =====================================================================
   SZENE 0 – INTRO (0–3 s)
   ===================================================================== */
function sceneIntro(t) {
  // Lichtstreifen, die zum Punkt fliegen
  for (let i = 0; i < 14; i++) {
    const a = rnd(i * 9.1) * TAU, d0 = 1400, st = .02 * i;
    const p = P(t, st, st + .55, E.inCubic);
    if (p <= 0 || p >= 1) continue;
    const r1 = d0 * (1 - p), r2 = r1 + 220 * Math.sin(Math.PI * p);
    g.strokeStyle = `rgba(110,255,170,${.55 * Math.sin(Math.PI * p)})`; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); g.stroke();
  }
  // Fließende Pfade hinter dem Logo
  flowLines(t, 0, 40, 2600, 220, 6, P(t, .35, 1.6, E.outCubic), 0);
  flowLines(t, 0, -30, 2600, 160, 4, P(t, .5, 1.8, E.outCubic), 2.4, '0,168,132');

  const lx = lerp(0, -360, P(t, 1.55, 2.15, E.outExpo));
  const R = 140;
  // fallender Punkt
  if (t < .62) {
    const y = lerp(-620, 0, P(t, 0, .5, E.inCubic));
    const sq = t > .5 ? 1 - .35 * Math.sin(Math.PI * clamp((t - .5) / .12)) : 1;
    g.save(); glow('rgba(37,211,102,.9)', 40); g.fillStyle = C.green;
    g.beginPath(); g.ellipse(0, y, 22 / sq, 22 * sq, 0, 0, TAU); g.fill(); g.restore();
  }
  // Schockwellen
  for (let k = 0; k < 3; k++) {
    const p = P(t, .5 + k * .12, 1.3 + k * .12, E.outCubic);
    if (p > 0 && p < 1) { g.strokeStyle = `rgba(37,211,102,${(1 - p) * .7})`; g.lineWidth = 6 * (1 - p) + 1; circle(lx, 0, 40 + p * (520 + k * 160)); g.stroke(); }
  }
  // Logo aufbauen
  const ring = P(t, .5, 1.2, E.inOutCubic), fill = P(t, 1.0, 1.45, E.outCubic), gl = P(t, 1.25, 1.75, E.outBack);
  if (t >= .5) {
    g.save(); glow('rgba(37,211,102,.55)', 60 * fill);
    logo(lx, 0, R, { ring, fill, glyph: gl, glyphRot: (1 - gl) * -.8, shine: P(t, 2.0, 2.45, E.inOutSine) });
    g.restore();
    // Ring-Partikel bei Füllung
    for (let i = 0; i < 18; i++) {
      const p = P(t, 1.05, 1.75, E.outExpo); if (p <= 0 || p >= 1) break;
      const a = i / 18 * TAU + .2, d = R + 30 + p * (140 + rnd(i) * 160);
      g.fillStyle = `rgba(150,255,190,${1 - p})`; circle(lx + Math.cos(a) * d, Math.sin(a) * d, 5 * (1 - p) + 1); g.fill();
    }
  }
  // Wortmarke
  const wx = -175;
  font(800, 150); g.textBaseline = 'alphabetic';
  const word = 'WhatsApp'; let cx = wx;
  for (let i = 0; i < word.length; i++) {
    const ch = word[i], cw = g.measureText(ch).width;
    const p = P(t, 1.72 + i * .035, 2.3 + i * .035, E.outExpo);
    if (p > 0) { g.save(); g.beginPath(); g.rect(cx - 10, -130, cw + 20, 200); g.clip();
      g.fillStyle = '#fff'; g.fillText(ch, cx, 50 + (1 - p) * 170); g.restore(); }
    cx += cw;
  }
  ktext('Nachrichten. Anrufe. Momente.', wx + 6, 120, 34, 600, 'rgba(200,255,220,.8)', t, 1.95, 99, { stagger: .07 });
}

  // Blitze bei Schnitten / Hit
  const flash = Math.max(0, 1 - Math.abs(t - 28.52) / .18) * .35;
  if (flash > 0) { g.fillStyle = `rgba(210,255,230,${flash})`; g.fillRect(0, 0, W, H); }
  g.restore();
}
const NOISE = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const d = c.getContext('2d'); const im = d.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.floor(rnd(i * .37 + 1) * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  d.putImageData(im, 0, 0); return c;
})();
function post(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  let p = _pat.get(NOISE); if (!p) { p = g.createPattern(NOISE, 'repeat'); _pat.set(NOISE, p); }
  const f = Math.floor(t * FPS);
  g.save(); g.globalAlpha = .045; g.globalCompositeOperation = 'overlay';
  g.translate(-Math.floor(rnd(f) * 256), -Math.floor(rnd(f + 99) * 256)); g.fillStyle = p; g.fillRect(0, 0, W + 256, H + 256);
  g.restore();
  // Fade-in ganz am Anfang
  if (t < .25) { g.fillStyle = `rgba(0,0,0,${1 - t / .25})`; g.fillRect(0, 0, W, H); }
}

const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const acc = document.createElement('canvas'); acc.width = W; acc.height = H; const actx = acc.getContext('2d');
function renderFrame(t, samples = 1, shutter = .55) {
  if (samples <= 1) { drawFrame(ctx, t); }
  else {
    for (let i = 0; i < samples; i++) {
      const tt = clamp(t + (i / (samples - 1) - .5) * shutter / FPS, 0, DUR - 1e-4);
      drawFrame(actx, tt);
      ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(acc, 0, 0); ctx.globalAlpha = 1;
    }
  }
  g = ctx; post(t);
}
window.renderFrame = renderFrame;
window.renderFrameData = (f, samples = 6, q = .95) => { renderFrame(f / FPS, samples); return cv.toDataURL('image/jpeg', q).split(',')[1]; };

/* ---------- Player ---------- */
(async () => {
  await Promise.all([500, 600, 700, 800].map(w => document.fonts.load(`${w} 40px Manrope`)));
  window.__ready = true;
  if (RENDER) { renderFrame(0); return; }
  const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tm = document.getElementById('tm');
  const qs = parseFloat(new URLSearchParams(location.search).get('t'));
  let playing = isNaN(qs), t0 = performance.now() / 1000 - (isNaN(qs) ? 0 : qs), cur = isNaN(qs) ? 0 : qs;
  const set = v => { cur = v; sc.value = v; tm.textContent = v.toFixed(2); renderFrame(v); };
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? '❚❚' : '▶'; t0 = performance.now() / 1000 - cur; };
  sc.oninput = () => { playing = false; pp.textContent = '▶'; set(parseFloat(sc.value)); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.onclick(); } });
  if (!playing) pp.textContent = '▶';
  set(cur);
  const loop = () => { if (playing) { let v = performance.now() / 1000 - t0; if (v >= DUR) { t0 += DUR; v -= DUR; } set(v); } requestAnimationFrame(loop); };
  loop();
})();
</script>
