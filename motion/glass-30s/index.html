<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Messenger Motion</title>
<style>
@font-face{font-family:Manrope;src:url(../../manrope-500.woff2) format('woff2');font-weight:500}
@font-face{font-family:Manrope;src:url(../../manrope-600.woff2) format('woff2');font-weight:600}
@font-face{font-family:Manrope;src:url(../../manrope-700.woff2) format('woff2');font-weight:700}

html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Manrope,system-ui,sans-serif}
body{display:grid;place-items:center}
canvas{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;
  background:rgba(40,40,48,.45);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  border:1px solid rgba(255,255,255,.18);color:#f5f5f7;padding:8px 14px;border-radius:999px;
  font-size:14px;width:min(720px,calc(100vw - 32px));box-sizing:border-box;opacity:.3;transition:opacity .2s}
#ui:hover{opacity:1}
#ui button{background:rgba(255,255,255,.9);color:#000;border:0;border-radius:999px;width:34px;height:34px;font-weight:800;cursor:pointer}
#ui input{flex:1;accent-color:#0A84FF}
#ui span{font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
body.render #ui{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="pp" title="Play/Pause (Leertaste)">❚❚</button><input id="sc" type="range" min="0" max="30" step="0.001" value="0"><span id="tm">0.00</span></div>
<script>
'use strict';
/* =====================================================================
   Glass Messenger – 30s Motion Graphic (Apple-/Liquid-Glass-Look)
   Eigenständiges Design: eigenes App-Icon, eigene Farben, keine
   Marken-Assets. Deterministische Canvas-Engine: jedes Bild = f(t).
   ===================================================================== */
const W = 1920, H = 1080, FPS = 30, DUR = 30;
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

const A = { blue: '#0A84FF', indigo: '#5E5CE6', purple: '#BF5AF2', pink: '#FF375F', orange: '#FF9F0A',
  yellow: '#FFD60A', mint: '#30D158', teal: '#64D2FF', red: '#FF453A', white: '#F5F5F7' };
const SUBTXT = 'rgba(235,235,245,.62)';
const AV = [['#FF9A8B','#FF6A88'],['#8EC5FC','#5B8DEF'],['#F6D365','#FDA085'],['#84FAB0','#3CBFAE'],
            ['#C2A3FF','#7B61FF'],['#FFB86B','#FF7A59'],['#6EE7F9','#2BA6C0'],['#F9A8D4','#E5579A']];

/* ---------- Mathe & Easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const E = {
  lin: x => x,
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackSoft: x => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * TAU / 3) + 1,
  outBounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; },
};
const P = (t, a, b, e = E.inOutCubic) => e(clamp((t - a) / (b - a)));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const bez = (p0, p1, p2, p3, t) => { const u = 1 - t;
  return [u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]; };
const qbez = (p0, p1, p2, t) => { const u = 1 - t; return [u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]]; };
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------- Zeichen-Grundlagen ---------- */
let g;
const FONT = 'Manrope, system-ui, sans-serif';
function font(w, s, fam = FONT) { g.font = `${w} ${s}px ${fam}`; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); }
function circle(x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); }
function alpha(a) { g.globalAlpha *= clamp(a); }
function scaleAt(x, y, s, r = 0) { g.translate(x, y); if (r) g.rotate(r); g.scale(s, s); g.translate(-x, -y); }
function lgrad(x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => gr.addColorStop(i / (stops.length - 1), s)); return gr; }
function curScale() { const m = g.getTransform(); return Math.hypot(m.a, m.b); }
function glow(col, blur) { g.shadowColor = col; g.shadowBlur = blur; g.shadowOffsetX = 0; g.shadowOffsetY = 0; }
function noGlow() { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; }
function softShadow(x, y, w, h, r, a = .4, blur = 30, dy = 18) {
  const sc = curScale(); g.save(); g.filter = `blur(${Math.min(60, blur * sc)}px)`;
  rr(x + w * .03, y + dy, w * .94, h, r); g.fillStyle = `rgba(0,0,0,${a})`; g.fill(); g.restore();
}

/* ---------- LIQUID GLASS ----------
   Backdrop-Blur + Sättigung + Lupen-Brechung aus dem bereits gezeichneten
   Canvas, dazu Tönung, Glanz und Licht-Kante. */
function devBounds(x, y, w, h) {
  const m = g.getTransform(); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [a, b] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) {
    const px = m.a * a + m.c * b + m.e, py = m.b * a + m.d * b + m.f;
    x0 = Math.min(x0, px); y0 = Math.min(y0, py); x1 = Math.max(x1, px); y1 = Math.max(y1, py);
  }

function glass(x, y, w, h, r, o = {}) {
  const { blur = 22, tint = .1, mag = 1.08, shadow = .3, sat = 1.8, color = null, rim = 1, gloss = 1 } = o;
  if (w <= 1 || h <= 1) return;
  const sc = curScale();
  if (shadow > 0) softShadow(x, y, w, h, r, shadow, 26, Math.min(22, h * .08));
  const [bx0, by0, bx1, by1] = devBounds(x, y, w, h);
  const cw = g.canvas.width, ch = g.canvas.height;
  if (bx1 > 0 && by1 > 0 && bx0 < cw && by0 < ch) {
    const pad = 40, sx = Math.max(0, Math.floor(bx0 - pad)), sy = Math.max(0, Math.floor(by0 - pad));
    const ex = Math.min(cw, Math.ceil(bx1 + pad)), ey = Math.min(ch, Math.ceil(by1 + pad));
    if (ex - sx > 2 && ey - sy > 2) {
      g.save(); rr(x, y, w, h, r); g.clip(); g.setTransform(1, 0, 0, 1, 0, 0);
      g.filter = `blur(${Math.min(36, Math.max(1, blur * sc))}px) saturate(${sat})`;
      const cx = (bx0 + bx1) / 2, cy = (by0 + by1) / 2, sw = ex - sx, sh = ey - sy;
      g.drawImage(g.canvas, sx, sy, sw, sh, cx + (sx - cx) * mag, cy + (sy - cy) * mag, sw * mag, sh * mag);
      g.restore();
    }
  }
  rr(x, y, w, h, r); g.fillStyle = color || `rgba(255,255,255,${tint})`; g.fill();
  if (gloss) {
    g.save(); rr(x, y, w, h, r); g.clip();
    g.fillStyle = lgrad(x, y, x, y + h * .55, ['rgba(255,255,255,.2)', 'rgba(255,255,255,0)']); g.fillRect(x, y, w, h * .55);
    g.fillStyle = lgrad(x, y + h, x, y + h * .7, ['rgba(255,255,255,.08)', 'rgba(255,255,255,0)']); g.fillRect(x, y + h * .7, w, h * .3);
    g.restore();
  }
  if (rim) {
    const lw = Math.max(1, 1.6 / Math.max(.4, sc)) * Math.max(1, Math.min(w, h) / 220);
    rr(x + lw / 2, y + lw / 2, w - lw, h - lw, Math.max(0, r - lw / 2)); g.lineWidth = lw;
    g.strokeStyle = lgrad(x, y, x + w * .6, y + h, ['rgba(255,255,255,.85)', 'rgba(255,255,255,.12)', 'rgba(255,255,255,.04)', 'rgba(255,255,255,.5)']);
    g.stroke();
  }
}

/* Material-Icons (Apache 2.0) */
const IC = {};

for (const k in ICON_SRC) IC[k] = new Path2D(ICON_SRC[k]);
function icon(n, x, y, s, col) {
  g.save(); g.translate(x - s / 2, y - s / 2); g.scale(s / 24, s / 24);
  g.fillStyle = Array.isArray(col) ? lgrad(2, 2, 22, 22, col) : col;

/* ---------- Typo: Apple-Style Reveal (Blur + Rise + Fade) ---------- */

function ktext(str, x, y, size, weight, color, lt, tin, tout = 99, o = {}) {

  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const x0 = cx, sc = curScale();

function titleBlock(lt, x, y, eye, eyeCol, lines, sub, tin, tout, size, cols, align = 'left') {
  ktext(eye, x, y, 30, 700, eyeCol, lt, tin, tout, { align, ls: 0, stagger: .03 });
  lines.forEach((l, i) => ktext(l, x, y + size * 1.02 + i * size * 1.04, size, 800,
    i === lines.length - 1 && cols ? gradText(cols) : A.white, lt, tin + .08 + i * .1, tout + i * .05, { align }));

}
function chip(x, y, ic, text, p, o = {}) {

  g.save(); font(600, 22); const tw = g.measureText(text).width, w = tw + h + 30;

/* ---------- Elemente ---------- */

  g.fillStyle = 'rgba(255,255,255,.9)';

  g.restore();

/* Eigenes App-Icon: Squircle mit Farbverlauf + Glas-Sprechblasen */
function iconPath(x, y, s) { rr(x - s / 2, y - s / 2, s, s, s * .235); }

const ICON_X = -380, ICON_S = 280;
const K = [

  { t: 21.35, x: -2600, y: 3600, z: 1.0, r: -.02, e: E.inOutQuint, bank: -.08, dip: .3 },
  { t: 23.65, x: -2620, y: 3592, z: 1.07, r: .018, e: E.inOutSine },

function cam(t) {
  if (t <= K[0].t) return { ...K[0] };
  for (let i = 0; i < K.length - 1; i++) {
    const a = K[i], b = K[i + 1];
    if (t >= a.t && t < b.t) {
      const p = (b.e || E.inOutSine)((t - a.t) / (b.t - a.t)), s = Math.sin(Math.PI * p);
      const z = Math.exp(lerp(Math.log(a.z), Math.log(b.z), p));

      return { x: lerp(a.x, b.x, pxy), y: lerp(a.y, b.y, pxy), z: z * (1 - (b.dip || 0) * s), r: lerp(a.r, b.r, p) + (b.bank || 0) * s };
    }

}

function worldOrbs(t, c) {
  const R = Math.hypot(W, H) / 2 / c.z + 900;
  const list = [['intro', [0, 0]], ...Object.entries(S).map(([k, v]) => [k, v])];
  for (const [k, [ox, oy]] of list) {
    if (Math.abs(ox - c.x) > R + 1500 || Math.abs(oy - c.y) > R + 1500) continue;
    if (k === 'intro' && t > 3.2) continue;

    ORBS[k].forEach(([x, y, r, col], i) => {

/* feine Lichtfäden – "Flow" */
function flowLines(lt, cx, cy, wdt, amp, n, p, phase = 0, cols = ['255,255,255']) {
  if (p <= 0) return;
  g.save(); g.lineCap = 'round';
  for (let k = 0; k < n; k++) {
    const a = .05 + .1 * (1 - k / n), col = cols[k % cols.length];
    g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = 1.5 + (k === 0 ? 1.5 : 0);
    g.beginPath();
    const steps = 90, end = Math.floor(steps * p);
    for (let s = 0; s <= end; s++) {
      const u = s / steps, x = cx - wdt / 2 + u * wdt, env = Math.sin(Math.PI * u);
      const y = cy + env * amp * (Math.sin(u * 7 + lt * 1.6 + k * .55 + phase) * .7 + Math.sin(u * 13 - lt * 1.1 + k) * .3) + k * 9;
      s ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}

const SPEC = [A.teal, A.blue, A.indigo, A.purple, A.pink, A.orange];
function sceneIntro(t) {
  for (let i = 0; i < 16; i++) {
    const a = rnd(i * 9.1) * TAU, st = .02 * i, p = P(t, st, st + .55, E.inCubic);
    if (p <= 0 || p >= 1) continue;

    g.beginPath(); g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); g.stroke();
  }
  flowLines(t, 0, 60, 2600, 200, 6, P(t, .35, 1.6, E.outCubic), 0, ['255,255,255', '140,200,255', '210,160,255']);

  const lx = lerp(0, ICON_X, P(t, 1.55, 2.15, E.outExpo)), s = ICON_S;

    g.save(); g.translate(0, y); g.scale(1 / sq, sq);

  }
  if (t >= .5) {

    appIcon(lx, 0, s, { outline, fill, glyph: gl, glyphRot: (1 - gl) * -.5, shine: P(t, 2.0, 2.5, E.inOutSine), lt: t });
    for (let i = 0; i < 22; i++) {
      const p = P(t, 1.05, 1.8, E.outExpo); if (p <= 0 || p >= 1) break;
      const a = i / 22 * TAU + .2, d = s * .6 + p * (140 + rnd(i) * 180);

    g.save(); scaleAt(0, ly, E.outElastic(hit) * (1 + .015 * Math.sin(lt * 3)));
    appIcon(0, ly, 250, { shine: P(lt, 2.3, 2.85, E.inOutSine), lt }); g.restore();
  }
  // Claim mit Licht-Sweep
  const wm = WM_CANVAS, wg = wm.getContext('2d');
  const prev = g; g = wg; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, wm.width, wm.height);
  font(800, 118); g.letterSpacing = `${-.03 * 118}px`;
  const w1 = g.measureText('Bleib in').width, w2 = g.measureText('Verbindung.').width, gapW = 34; g.letterSpacing = '0px';
  const sx0 = wm.width / 2 - (w1 + gapW + w2) / 2;
  ktext('Bleib in', sx0, 150, 118, 800, A.white, lt, 1.7, 99);
  ktext('Verbindung.', sx0 + w1 + gapW, 150, 118, 800, gradText([A.teal, A.blue, A.purple, A.pink]), lt, 1.8, 99);
  const sw = P(lt, 2.35, 2.95, E.inOutSine);
  if (sw > 0 && sw < 1) { g.globalCompositeOperation = 'source-atop'; const sx = lerp(-300, wm.width + 300, sw);
    g.fillStyle = lgrad(sx - 160, 0, sx + 160, 0, ['rgba(255,255,255,0)', 'rgba(255,255,255,.85)', 'rgba(255,255,255,0)']); g.fillRect(0, 0, wm.width, wm.height);
    g.globalCompositeOperation = 'source-over'; }
  g = prev; g.drawImage(wm, -wm.width / 2, 40);
  ktext('Nachrichten. Anrufe. Momente. Alles in einer App.', 0, 290, 34, 600, SUBTXT, lt, 1.95, 99, { align: 'center', stagger: .035, dur: .7, ls: -.01 });
}

/* =====================================================================
   KOMPOSITION
   ===================================================================== */
const SCENES = [
  { a: 0, at: [0, 0], fn: sceneIntro, from: 0, to: 3.0 },
  { a: 3.0, at: S.chat, fn: sceneChat, from: 3.0, to: 8.45 },
  { a: 8.0, at: S.media, fn: sceneMedia, from: 7.55, to: 11.45 },
  { a: 11.0, at: S.calls, fn: sceneCalls, from: 10.55, to: 14.95 },
  { a: 14.5, at: S.groups, fn: sceneGroups, from: 14.05, to: 18.45 },
  { a: 18.0, at: S.status, fn: sceneStatus, from: 17.55, to: 21.45 },
  { a: 21.0, at: S.loc, fn: sceneLocation, from: 20.55, to: 24.45 },
  { a: 24.0, at: S.enc, fn: sceneEncrypt, from: 23.55, to: 27.45 },
  { a: 27.0, at: S.outro, fn: sceneOutro, from: 26.55, to: 30.1 },
];
function drawFrame(c2d, t) {
  g = c2d;
  g.save();
  const c = cam(t);
  background(t, c);
  applyCam(c);
  worldOrbs(t, c);
  for (const s of SCENES) {
    if (t < s.from || t >= s.to) continue;
    g.save(); g.translate(s.at[0], s.at[1]);
    s.fn(t - s.a);
    g.restore();
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (t >= 2.94 && t < 3.75) {
    const p = P(t, 3.0, 3.7, E.outExpo), R = p * 1250;
    g.beginPath(); g.rect(0, 0, W, H); g.arc(W / 2, H / 2, Math.max(.1, R), 0, TAU, true);
    g.fillStyle = lgrad(0, 0, W, H, ['#5C7CFF', '#7A62FF', '#9A5BFF']); g.fill('evenodd');
    if (R > 1) { g.beginPath(); g.arc(W / 2, H / 2, R, 0, TAU); g.strokeStyle = `rgba(255,255,255,${.9 * (1 - p)})`; g.lineWidth = 14 * (1 - p) + 2; g.stroke(); }
  }
  const flash = Math.max(0, 1 - Math.abs(t - 28.52) / .18) * .3;
  if (flash > 0) { g.fillStyle = `rgba(235,240,255,${flash})`; g.fillRect(0, 0, W, H); }
  g.restore();
}
const NOISE = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const d = c.getContext('2d'); const im = d.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.floor(rnd(i * .37 + 1) * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  d.putImageData(im, 0, 0); return c;
})();
let NOISE_PAT = null;
function post(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  const v = g.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  if (!NOISE_PAT) NOISE_PAT = g.createPattern(NOISE, 'repeat');
  const f = Math.floor(t * FPS);
  g.save(); g.globalAlpha = .03; g.globalCompositeOperation = 'overlay';
  g.translate(-Math.floor(rnd(f) * 256), -Math.floor(rnd(f + 99) * 256)); g.fillStyle = NOISE_PAT; g.fillRect(0, 0, W + 256, H + 256);
  g.restore();
  if (t < .25) { g.fillStyle = `rgba(0,0,0,${1 - t / .25})`; g.fillRect(0, 0, W, H); }
}

const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const acc = document.createElement('canvas'); acc.width = W; acc.height = H; const actx = acc.getContext('2d');
function renderFrame(t, samples = 1, shutter = .55) {
  if (samples <= 1) drawFrame(ctx, t);
  else {
    for (let i = 0; i < samples; i++) {
      const tt = clamp(t + (i / (samples - 1) - .5) * shutter / FPS, 0, DUR - 1e-4);
      drawFrame(actx, tt);
      ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(acc, 0, 0); ctx.globalAlpha = 1;
    }
  }
  g = ctx; post(t);
}
window.renderFrame = renderFrame;
window.renderFrameData = (f, samples = 6, q = .95) => { renderFrame(f / FPS, samples); return cv.toDataURL('image/jpeg', q).split(',')[1]; };

(async () => {
  await Promise.all([500, 600, 700, 800].map(w => document.fonts.load(`${w} 40px Manrope`)));
  window.__ready = true;
  if (RENDER) { renderFrame(0); return; }
  const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tm = document.getElementById('tm');
  const qs = parseFloat(new URLSearchParams(location.search).get('t'));
  let playing = isNaN(qs), t0 = performance.now() / 1000 - (isNaN(qs) ? 0 : qs), cur = isNaN(qs) ? 0 : qs;
  const set = v => { cur = v; sc.value = v; tm.textContent = v.toFixed(2); renderFrame(v); };
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? '❚❚' : '▶'; t0 = performance.now() / 1000 - cur; };
  sc.oninput = () => { playing = false; pp.textContent = '▶'; set(parseFloat(sc.value)); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.onclick(); } });
  if (!playing) pp.textContent = '▶';
  set(cur);
  const loop = () => { if (playing) { let v = performance.now() / 1000 - t0; if (v >= DUR) { t0 += DUR; v -= DUR; } set(v); } requestAnimationFrame(loop); };
  loop();
})();
</script>
