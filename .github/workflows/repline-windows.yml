name: Repline Windows app

on:
  workflow_dispatch:
  push:
    branches: [claude/nifty-cannon-p4pndg]
    paths:
      - "daily-pro-routine/**"
      - ".github/workflows/repline-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web app
        run: python daily-pro-routine/tools/build_app.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Electron
        working-directory: daily-pro-routine/desktop
        run: npm install --no-audit --no-fund
      - name: Build installer and portable exe
        working-directory: daily-pro-routine/desktop
        run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Repline-Windows
          path: daily-pro-routine/desktop/dist/*.exe
          if-no-files-found: error
