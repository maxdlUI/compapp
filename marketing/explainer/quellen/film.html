// ---------------- three setup ----------------

{

key(16.0, shot(tools, sr.x + 230, sr.y + 120, 740, .08, .1, 120), 0);
key(16.8, shot(tools, sr.x + 190, sr.y + 360, 1000, .18, .03, 120), 0);

// Viewer-Phase: Kamera bleibt, Viewer-Ebene übernimmt

// --- Outro: großer Rückzug

key(62, free(1500, -500, 6200, 1500, -700, -300), .02, t => t);

function camAt(t) {
  let i = 0; while (i < K.length - 2 && t >= K[i + 1].t) i++;
  const a = K[i], b = K[i + 1];
  const p = b.ease(seg(t, a.t, b.t));
  const pos = a.pos.clone().lerp(b.pos, p), look = a.look.clone().lerp(b.look, p);

  return { pos, look, roll };
}

// ---------------- overlay ----------------
const ov = document.getElementById('ov'), g = ov.getContext('2d');
const C = { text: '#efeaff', muted: '#a39cc2', acc: '#a78bfa', acc2: '#6d28d9', storm: '#c4b5fd', dealt: '#4fd6c3', taken: '#ff93b0', rot: '#67d4f0', cta: '#ffc266', discord: '#5865F2' };
const DISP = 'Unbounded', SANS = 'Manrope';
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(str, x, y, { font = SANS, size = 40, weight = 600, color = C.text, align = 'left', ls = 0, alpha = 1, base = 'alphabetic' } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = `${weight} ${size}px ${font}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = base; g.letterSpacing = ls + 'px'; g.fillText(str, x, y); g.restore();
}
function riseText(str, x, y, t, { font = DISP, size = 90, weight = 700, color = C.text, align = 'left', stagger = .025, dur = .55, ls = -1, gradient = null, alpha = 1 } = {}) {

  const total = g.measureText(str).width; const sx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;

    const p = eOutExpo(seg(t, i * stagger, i * stagger + dur));

    }

  }

}
function glass(x, y, w, h, r = 28, a = 1) {

  rr(x, y, w, h, r); g.fillStyle = 'rgba(20,17,42,.86)'; g.fill(); g.shadowColor = 'transparent';

// Cursor

  const vIn = eOutExpo(seg(t, 51.1, 51.8)), vOut = eInOutCubic(seg(t, 54.5, 55.2));
  viewer.material.opacity = vIn * (1 - vOut);
  if (viewer.material.opacity > 0) {
    const fwd = V(0, 0, -1).applyQuaternion(camera.quaternion); const d = 700;
    viewer.position.copy(camera.position).add(fwd.multiplyScalar(d)); viewer.quaternion.copy(camera.quaternion);
    // sichtbare Höhe bei d: 2*d*tan(17.5°) = 441 → Viewer (900 hoch) muss skaliert werden
    const fit = 2 * d * Math.tan(THREE.MathUtils.degToRad(17.5)) / 900;
    const zoom = lerp(.82, 1, vIn) * (1 + 1.1 * eInOutCubic(seg(t, 52.0, 54.6)));
    viewer.scale.setScalar(fit * zoom);
    viewer.rotateZ(lerp(-.04, 0, vIn));
    // Zoom auf Kartenpunkt (leicht verschoben)
    const sh = eInOutCubic(seg(t, 52.0, 54.6));
    viewer.translateX(-110 * sh * fit * zoom); viewer.translateY(-60 * sh * fit * zoom);
  }
  viewer.visible = viewer.material.opacity > 0;
  motes.rotation.y = t * .01;

  bloom.strength = .22 + .9 * (1 - seg(t, 3.8, 5.0)) + .4 * pulse(t, 56.0, 1.2);
  composer.render();

  // ---------------- Overlay ----------------
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1;
  intro(t);
  // Home: Kapitel
  if (t > 5.4 && t < 12) {
    chapter(t - 5.6, '', 'Willkommen bei KREVO');
    const p0 = project(onPage(home, 720, 540, 0));
  }
  // Storm
  if (t > 13.4 && t < 25.2) {
    chapter(t - 13.4, '01', 'Storm-Timer');
    const card = cStorm, m = meta.storm;
    // Callout Auswahl
    if (t > 14.9 && t < 16.4) callout(project(card.local(m.rate.x + m.rate.w - 30, m.rate.y + m.rate.h / 2)), 90, -120, '1 · 2 · 5 · 8 · 10', t - 14.9, { sub: 'Schaden pro Sekunde wählen' });
    const sp = project(card.local(m.start.x + m.start.w / 2, m.start.y + m.start.h / 2));
    const cp = cursorPath(t, [[16.2, { x: sp.x + 260, y: sp.y + 160 }], [16.85, sp], [17.4, { x: sp.x + 30, y: sp.y + 20 }]], [16.95]);
    if (cp) { cursor(cp.x, cp.y, cp.press, cp.al); ripple(sp.x, sp.y, t - 16.95); }
    const al = project(card.local(m.alert.x + m.alert.w, m.alert.y + 20));
    if (t > 19.3 && t < 24.6) callout(al, 150, -70, 'Ab 500: Warnung', t - 19.3, { color: '#8b5cf6', sub: 'Verlasse den Storm.' });
    const al2 = project(card.local(m.alert.x + m.alert.w, m.alert.y + m.alert.h - 10));
    if (t > 22.0 && t < 24.6) callout(al2, 150, 90, 'Ab 600: Akut', t - 22.0, { color: C.cta, sub: 'Sofort raus aus dem Storm!' });
    // Fade out callouts
  }
  // Net
  if (t > 25.0 && t < 33.0) {
    chapter(t - 25.0, '02', 'Net Damage', C.dealt);
    const card = cNet, cl = meta.net.clicks;
    const pts = [[25.7, (() => { const p = project(card.local(cl[0].x + 25, cl[0].y + 28)); return { x: p.x + 200, y: p.y + 220 }; })()]];
    NET_CLICKS.forEach((c2, i) => pts.push([c2 - .02, project(card.local(cl[i].x + cl[i].w / 2, cl[i].y + cl[i].h / 2))]));
    const cp = cursorPath(t, pts, NET_CLICKS);
    if (cp) cursor(cp.x, cp.y, cp.press, cp.al);
    NET_CLICKS.forEach((c2, i) => { const p = project(card.local(cl[i].x + cl[i].w / 2, cl[i].y + cl[i].h / 2)); ripple(p.x, p.y, t - c2); });
    if (t > 27.2 && t < 32.8) callout(project(card.local(30, 175)), -170, 90, 'Ausgeteilt', t - 27.2, { color: C.dealt, sub: 'Damage Dealt' });
    if (t > 28.4 && t < 32.8) callout(project(card.local(350, 175)), 170, 90, 'Erlitten', t - 28.4, { color: C.taken, sub: 'Damage Taken' });
    if (t > 31.1 && t < 32.9) callout(project(card.local(300, 470)), 170, 40, 'Dealt − Taken', t - 31.1, { color: C.acc, sub: 'dein Net Damage' });
  }
  // Team
  if (t > 33.0 && t < 41.4) teamScene(t - 33.0);
  // Rotation
  if (t > 41.4 && t < 47.6) {
    chapter(t - 41.4, '04', 'Rotation', C.rot);
    const card = cRot, m = meta.rot;
    const sp = project(card.local(m.start.x + m.start.w / 2, m.start.y + m.start.h / 2));
    const cp = cursorPath(t, [[42.3, { x: sp.x + 240, y: sp.y + 180 }], [42.85, sp], [43.4, { x: sp.x + 40, y: sp.y + 30 }]], [42.95]);
    if (cp) { cursor(cp.x, cp.y, cp.press, cp.al); ripple(sp.x, sp.y, t - 42.95); }
    if (t > 43.2 && t < 47.4) callout(project(card.local(m.presets.x + m.presets.w - 40, m.presets.y + m.presets.h / 2)), 160, 40, 'Eigene Presets', t - 43.2, { color: C.rot, sub: '1:00 bis 5:00 und mehr' });
    if (t > 44.6 && t < 47.4) {
      const sp2 = project(card.local(292, 45));
      callout(sp2, 160, -40, 'Ton an', t - 44.6, { color: C.rot, sub: 'Signal zur Rotation' });
      // Schallwellen
      for (let k = 0; k < 3; k++) { const ph = ((t - 44.6) * 1.4 + k / 3) % 1; g.save(); g.beginPath(); g.arc(sp2.x, sp2.y, 20 + ph * 70, -.6, .6); g.strokeStyle = `rgba(103,212,240,${1 - ph})`; g.lineWidth = 3; g.stroke(); g.restore(); }
    }
  }
  // Map
  if (t > 47.4 && t < 55.0) {
    chapter(t - 47.4, '05', 'Map', C.taken);
    // Scan-Licht beim Laden
    if (t > 48.6 && t < 49.6) {
      const card = cMap; const a = project(card.local(30, 60)), b = project(card.local(card.w - 30, 60));
      const p = eInOutCubic(seg(t, 48.6, 49.4));
      const y0 = project(card.local(30, 60)).y, y1 = project(card.local(30, card.h - 40)).y;
      g.save(); g.globalCompositeOperation = 'lighter'; const yy = lerp(y0, y1, p);
      const gr = g.createLinearGradient(0, yy - 80, 0, yy + 10); gr.addColorStop(0, 'rgba(196,181,253,0)'); gr.addColorStop(1, 'rgba(196,181,253,.5)');
      g.fillStyle = gr; g.fillRect(a.x, yy - 80, b.x - a.x, 90); g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(a.x, yy, b.x - a.x, 3); g.restore();
    }
    if (t > 48.0 && t < 49.0) {
      const p = project(cMap.local(586, 330));
      text('Bild hochladen', p.x, p.y + 120, { size: 1, alpha: 0 });
    }
    const card = cMap, m = meta.map;
    const fp = project(card.local(m.full.x + m.full.w / 2, m.full.y + m.full.h / 2));
    const cp = cursorPath(t, [[49.9, { x: fp.x + 220, y: fp.y + 160 }], [50.6, fp], [51.0, { x: fp.x + 20, y: fp.y + 10 }]], [50.7]);
    if (cp) { cursor(cp.x, cp.y, cp.press, cp.al); ripple(fp.x, fp.y, t - 50.7); }
    // Lokal-Badge
    const bp = eOutBack(seg(t, 52.2, 52.7), 1.8) * (1 - seg(t, 54.4, 54.8));
    if (bp > 0) {
      g.save(); g.translate(CX, 180); g.scale(bp, bp); g.globalAlpha = clamp(bp);
      glass(-300, -44, 600, 88, 44);
      g.beginPath(); g.roundRect(-262, -16, 26, 22, 4); g.fillStyle = C.dealt; g.fill(); g.beginPath(); g.arc(-249, -16, 9, Math.PI, 0); g.strokeStyle = C.dealt; g.lineWidth = 4; g.stroke();
      text('Bleibt nur auf deinem Gerät', 20, 10, { size: 30, weight: 700, align: 'center' });
      g.restore();
    }
  }
  if (t > 56.0) outro(t - 56.0);
  subtitles(t);
  // Übergangsblitze
  const fl = .4 * pulse(t, 4.0, .6) + .25 * pulse(t, 12.0, .35) + .25 * pulse(t, 33.0, .3) + .8 * pulse(t, 55.6, .8);
  if (fl > 0) { g.fillStyle = `rgba(239,234,255,${fl})`; g.fillRect(0, 0, W, H); }
  // Vignette + Grain
  const v = g.createRadialGradient(CX, CY, H * .38, CX, CY, H * 1.05); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .45; g.drawImage(grains[frame % 6], 0, 0, W, H); g.restore();
  // Ein-/Ausblenden
  const fade = Math.max(1 - seg(t, 0, .4), seg(t, 61.3, 62));
  if (fade > 0) { g.fillStyle = `rgba(8,7,15,${fade})`; g.fillRect(0, 0, W, H); }
}
await document.fonts.load('700 40px Unbounded'); await document.fonts.load('600 40px Unbounded'); await document.fonts.load('500 40px Unbounded');
for (const w of [500, 600, 700, 800]) await document.fonts.load(`${w} 40px Manrope`);
window.render = render; window.DUR = DUR; window.FPS = FPS; window.ready = true;
</script></body></html>
