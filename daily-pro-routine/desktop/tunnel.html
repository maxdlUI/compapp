<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repline focus tunnel</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#t { position: fixed; left: 50%; top: 50%; width: 40vh; height: 40vh; transform: translate(-50%, -50%); opacity: 0; transition: opacity .35s; pointer-events: none; }
.e { position: fixed; opacity: 0; transition: opacity .25s; }
.e.on { opacity: 1; }
#l { left: 0; top: 0; bottom: 0; width: 7vw; background: linear-gradient(90deg, rgba(56,224,255,.55), rgba(56,224,255,0)); }
#r { right: 0; top: 0; bottom: 0; width: 7vw; background: linear-gradient(270deg, rgba(56,224,255,.55), rgba(56,224,255,0)); }
#u { left: 0; right: 0; top: 0; height: 12vh; background: linear-gradient(180deg, rgba(56,224,255,.55), rgba(56,224,255,0)); }
#b { left: 0; right: 0; bottom: 0; height: 12vh; background: linear-gradient(0deg, rgba(56,224,255,.55), rgba(56,224,255,0)); }
</style>
</head>
<body>
<div id="t"></div>
<div class="e" id="l"></div><div class="e" id="r"></div><div class="e" id="u"></div><div class="e" id="b"></div>
<script>
/* Focus Tunnel: darkens the screen edges around the crosshair (drawn on top, reads nothing from the game).
   Also lights up a screen edge for Look Around. Driven by main.js through window.apply / window.flash. */
const num = (v, lo, hi, d) => { v = +v; return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; };
window.apply = (c) => {
  const t = document.getElementById("t");
  if (!c || !c.on) { t.style.opacity = 0; return; }
  // a clear hole in the middle; everything around it is darkened by a huge, softly blurred shadow
  const a = num(c.dark, 10, 90, 55) / 100, d = num(c.size, 12, 70, 34) * 1.3, soft = num(c.soft, 0, 100, 60) * 0.12;
  t.style.width = t.style.height = d + "vh";
  t.style.borderRadius = c.shape === "square" ? "6%" : "50%";
  t.style.boxShadow = `0 0 0 300vmax rgba(0,0,0,${a})`;
  t.style.filter = soft > 0.2 ? `blur(${soft.toFixed(2)}vh)` : "none"; // soft edge
  t.style.opacity = 1;
};
let ft = null;
window.flash = (dir) => {
  const el = document.getElementById({ l: "l", r: "r", u: "u", b: "b" }[dir] || "");
  if (!el) return;
  document.querySelectorAll(".e").forEach((x) => x.classList.remove("on"));
  el.classList.add("on"); clearTimeout(ft); ft = setTimeout(() => el.classList.remove("on"), 1600);
};
</script>
</body>
</html>
