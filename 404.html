<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seite nicht gefunden · KREVO</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08070f">
  <!-- GitHub Pages liefert diese Datei für jede unbekannte Adresse mit Status 404 aus, auch in Unterordnern.
       Deshalb zeigen alle Links absolut auf die App unter /compapp/, und Stil und Logo stehen direkt in der Datei. -->
  <link rel="icon" type="image/svg+xml" href="/compapp/favicon.svg">
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 600; src: url("/compapp/unbounded-600.woff2") format("woff2"); }
    @font-face { font-family: "Manrope"; font-weight: 500; src: url("/compapp/manrope-500.woff2") format("woff2"); }
    @font-face { font-family: "Manrope"; font-weight: 800; src: url("/compapp/manrope-800.woff2") format("woff2"); }
    :root { --bg: #08070f; --surface: #14112a; --border: rgba(255, 255, 255, 0.17); --text: #efeaff; --muted: #a39cc2; --gold: #a78bfa;
            --mono: "Manrope", system-ui, sans-serif; --display: "Unbounded", "Manrope", system-ui, sans-serif;
            --sans: "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; background: radial-gradient(700px 420px at 80% 0%, rgba(124, 58, 237, 0.25), transparent 60%), var(--bg); min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; color: var(--text);
           font-family: var(--sans); line-height: 1.45; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
    main { width: 100%; max-width: 440px; }
    .mark { width: 44px; height: 44px; display: block; margin-bottom: 28px; }
    .code { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.18em; color: var(--muted); margin: 0 0 10px; }
    .code::before { content: ""; display: inline-block; width: 22px; height: 2px; background: var(--gold); vertical-align: middle; margin-right: 10px; }
    h1 { font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.15; margin: 0 0 14px; letter-spacing: -0.01em; }
    p { margin: 0 0 12px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; border-radius: 999px;
            font-family: var(--mono); font-weight: 700; font-size: 0.95rem; text-decoration: none; border: 1px solid var(--border); color: var(--text); }
    a.btn-primary { background: linear-gradient(180deg, #b79dfb, #a78bfa 45%, #6d28d9); color: #120a26; border-color: transparent; }
    a.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .en { margin-top: 34px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.09); font-size: 0.9rem; }
    .en a { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><path fill="#EFEAFF" d="M126.76 3.65L52.4 78L52.4 126.54L123.15 197.28A100 100 0 1 1 126.76 3.65Z"/><path fill="#EFEAFF" d="M98.1 114.79L176.86 36.02A100 100 0 0 1 161.87 178.56Z"/><path fill="#A78BFA" d="M72.81 80.48L143.39 9.9A100 100 0 0 1 165.76 24.66L91.38 99.05Z"/></svg>
    <p class="code">FEHLER 404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Die Adresse ist falsch geschrieben oder die Seite wurde entfernt. KREVO selbst besteht aus einer einzigen Seite mit allen Werkzeugen.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/compapp/">Zur App</a>
      <a class="btn" href="/compapp/#storm">Storm-Timer</a>
      <a class="btn" href="/compapp/#damage">Net Damage</a>
    </div>
    <p class="en" lang="en">Page not found. <a href="/compapp/">Open KREVO</a></p>
  </main>
</body>
</html>
